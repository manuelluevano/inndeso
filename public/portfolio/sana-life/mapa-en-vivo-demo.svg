      <rect x="587" y="238" width="285" height="122" rx="22" fill="#fff"/><circle cx="627" cy="278" r="21" fill="#eaf1ff"/><text x="619" y="286" fill="#2e6bea" font-size="22">↗</text><text x="663" y="275" fill="#788781" font-size="11" font-weight="700">ENTREGAS COMPLETADAS</text><text x="663" y="315" fill="#102a23" font-size="32" font-weight="800">47</text><text x="663" y="337" fill="#6f7d78" font-size="12">68% del plan de hoy</text>
      <rect x="888" y="238" width="285" height="122" rx="22" fill="#fff"/><circle cx="928" cy="278" r="21" fill="#fff1e9"/><text x="919" y="286" fill="#ef6b43" font-size="22">$</text><text x="964" y="275" fill="#788781" font-size="11" font-weight="700">COBRANZA REGISTRADA</text><text x="964" y="315" fill="#102a23" font-size="30" font-weight="800">$38,420</text><text x="964" y="337" fill="#6f7d78" font-size="12">efectivo y transferencia</text>
      <rect x="1189" y="238" width="363" height="122" rx="22" fill="url(#hero)"/><text x="1216" y="276" fill="#acd4c7" font-size="11" font-weight="700">ÚLTIMA SINCRONIZACIÓN</text><circle cx="1223" cy="309" r="6" fill="#2fe2aa"/><text x="1242" y="318" fill="#fff" font-size="24" font-weight="800">Hace 18 segundos</text><text x="1216" y="341" fill="#b9d1ca" font-size="12">6 señales recibidas</text>
    </g>

