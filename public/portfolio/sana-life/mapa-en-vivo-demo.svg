    <rect x="18" y="298" width="210" height="48" rx="12" fill="#f16b43"/><circle cx="40" cy="322" r="6" fill="#fff"/><text x="54" y="327" fill="#fff" font-size="14" font-weight="700">Mapa en vivo</text>
    <g font-size="14" fill="#c4d5d0"><text x="54" y="388">Pedidos</text><text x="54" y="438">Clientes</text><text x="54" y="488">Productos</text><text x="54" y="538">Corte de caja</text><text x="54" y="588">Métricas</text><text x="54" y="638">Reportes</text><text x="54" y="688">Alertas</text></g>
    <circle cx="36" cy="944" r="5" fill="#2bd496"/><text x="52" y="949" fill="#c4d5d0" font-size="12">Operación conectada</text>

    <text x="286" y="61" fill="#64766f" font-size="11" letter-spacing="2">OPERACIÓN DIARIA</text>
    <rect x="1334" y="34" width="218" height="34" rx="17" fill="#edf0eb" stroke="#d9dfda"/><circle cx="1354" cy="51" r="5" fill="#2bc98e"/><text x="1370" y="56" fill="#26483f" font-size="12" font-weight="700">DEMO · DATOS FICTICIOS</text>
    <text x="286" y="122" fill="#123e34" font-size="14" font-weight="700" letter-spacing="2">SEGUIMIENTO EN CAMPO</text>
    <text x="286" y="170" fill="#0e2721" font-size="42" font-weight="800">Mapa de repartidores en vivo</text>
    <text x="286" y="202" fill="#6d7e78" font-size="16">Consulta ubicación, ruta, avance y última señal de cada jornada activa.</text>
    <rect x="1390" y="128" width="162" height="52" rx="15" fill="#123e34"/><text x="1430" y="160" fill="#fff" font-size="14" font-weight="700">↻  Actualizar</text>

