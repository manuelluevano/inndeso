<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Sana Life, mapa de repartidores en vivo</title>
  <desc id="desc">Pantalla demostrativa con datos ficticios de una plataforma logística veterinaria.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#143c32" flood-opacity=".12"/></filter>
    <pattern id="streets" width="120" height="90" patternUnits="userSpaceOnUse"><path d="M0 20H120M25 0V90M82 0V90" stroke="#dce3de" stroke-width="2"/><path d="M0 61H120M55 0V90" stroke="#e9edea"/></pattern>
    <linearGradient id="hero" x1="0" x2="1"><stop stop-color="#123e34"/><stop offset="1" stop-color="#245f50"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#f4f2eb"/>
  <rect width="246" height="1000" fill="#10382f"/>
  <g font-family="Arial, Helvetica, sans-serif">
