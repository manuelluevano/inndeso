      <circle cx="790" cy="674" r="38" fill="#2f70ff" opacity=".15"/><circle cx="790" cy="674" r="12" fill="#2f70ff" stroke="#fff" stroke-width="5"/>
      <rect x="718" y="578" width="195" height="70" rx="15" fill="#fff" filter="url(#shadow)"/><text x="737" y="604" fill="#122b24" font-size="13" font-weight="800">Laura Méndez</text><circle cx="739" cy="625" r="5" fill="#2bd496"/><text x="753" y="630" fill="#667770" font-size="11">En ruta · señal en vivo</text>
      <text x="329" y="440" fill="#77877f" font-size="10" font-weight="700">GUADALAJARA · OPERACIÓN DEMOSTRATIVA</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1208" y="390" width="344" height="560" rx="25" fill="#fff"/>
      <text x="1234" y="427" fill="#7b8a84" font-size="10" font-weight="700" letter-spacing="1.5">REPARTIDOR SELECCIONADO</text>
      <circle cx="1268" cy="480" r="34" fill="#e8f0ff"/><text x="1256" y="489" fill="#2f6fff" font-size="24">LM</text>
      <text x="1315" y="473" fill="#112a23" font-size="19" font-weight="800">Laura Méndez</text><text x="1315" y="496" fill="#718079" font-size="12">Ruta Centro · Unidad 04</text>
      <rect x="1234" y="527" width="292" height="54" rx="14" fill="#edf8f3"/><circle cx="1254" cy="554" r="6" fill="#25c88c"/><text x="1271" y="559" fill="#176c50" font-size="13" font-weight="700">En movimiento · 24 km/h</text>
      <g font-size="12"><text x="1234" y="622" fill="#7b8983">Última señal</text><text x="1430" y="622" fill="#17372e" font-weight="700">10:42:18</text><line x1="1234" y1="640" x2="1526" y2="640" stroke="#e4e9e6"/><text x="1234" y="675" fill="#7b8983">Batería</text><text x="1469" y="675" fill="#159364" font-weight="700">82%</text><line x1="1234" y1="693" x2="1526" y2="693" stroke="#e4e9e6"/><text x="1234" y="728" fill="#7b8983">Avance</text><text x="1462" y="728" fill="#17372e" font-weight="700">7 / 12</text><line x1="1234" y1="746" x2="1526" y2="746" stroke="#e4e9e6"/><text x="1234" y="781" fill="#7b8983">Cobranza</text><text x="1435" y="781" fill="#17372e" font-weight="700">$6,840</text></g>
      <text x="1234" y="832" fill="#7b8a84" font-size="10" font-weight="700" letter-spacing="1.5">SIGUIENTE ENTREGA</text><text x="1234" y="861" fill="#16352d" font-size="14" font-weight="800">Veterinaria Los Arcos</text><text x="1234" y="883" fill="#74827d" font-size="11">4 productos · cobro pendiente</text>
